name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # The README quick start, on a clean machine: the server must come up and serve the UI.
      - name: Quick start smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/data" "$RUNNER_TEMP/workspace"
          GRIFFIN_DEMO=1 GRIFFIN_AUTH=off GRIFFIN_DATA="$RUNNER_TEMP/data" GRIFFIN_WORKSPACE="$RUNNER_TEMP/workspace" \
            PORT=3100 node apps/server/src/index.mjs > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:3100/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:3100/healthz
          curl -fsS http://127.0.0.1:3100/ | grep -qi "<html" || { cat "$RUNNER_TEMP/server.log"; exit 1; }

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - target: app
            image: ghcr.io/paziresh24/griffin
          - target: broker
            image: ghcr.io/paziresh24/griffin-broker
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.source=https://github.com/paziresh24/Griffin
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          tags: griffin-${{ matrix.target }}:ci
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Image smoke test
        if: matrix.target == 'app'
        run: |
          docker run -d --name griffin -p 3100:3100 -e GRIFFIN_DEMO=1 griffin-app:ci
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:3100/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:3100/healthz || { docker logs griffin; exit 1; }
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: github.event_name != 'pull_request'
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
