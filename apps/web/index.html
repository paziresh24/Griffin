<!doctype html>
<html lang="fa" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#1a120c" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <script>
      // Skin before first paint (skin.js switches it later): no flash of the other look.
      try { var s = localStorage.getItem("griffin.skin"); document.documentElement.dataset.skin = s === "karsara" ? s : "griffin"; } catch (e) { document.documentElement.dataset.skin = "griffin"; }
    </script>
    <title>گریفین</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
