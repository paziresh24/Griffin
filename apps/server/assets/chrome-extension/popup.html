<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  body { width: 300px; margin: 0; padding: 14px; font: 13px/1.7 Vazirmatn, Tahoma, "Segoe UI", system-ui, sans-serif; color: #1c1917; background: #fff; }
  h1 { font-size: 14px; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
  h1 img { width: 20px; height: 20px; }
  .state { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; background: #f5f5f4; margin-bottom: 10px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #a8a29e; flex: none; }
  .on .dot { background: #16a34a; } .connecting .dot { background: #f59e0b; } .error .dot { background: #dc2626; }
  .err { color: #b91c1c; font-size: 12px; margin: -4px 0 10px; word-break: break-word; }
  label { display: block; font-size: 12px; color: #57534e; margin: 8px 0 3px; }
  input { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #d6d3d1; border-radius: 8px; font: inherit; }
  input.ltr { direction: ltr; text-align: left; font-family: ui-monospace, Menlo, monospace; }
  button { font: inherit; border: 0; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  .primary { background: #f97316; color: #fff; width: 100%; margin-top: 12px; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  .row button { flex: 1; background: #f5f5f4; }
  .row button:hover { background: #e7e5e4; }
  .muted { color: #78716c; font-size: 12px; margin-top: 10px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <h1><img src="icon48.png" alt="">گریفین · مرورگر من</h1>
  <div id="state" class="state"><span class="dot"></span><span id="stateText">…</span></div>
  <div id="error" class="err" hidden></div>
  <div id="update" class="err" style="color:#c2410c" hidden></div>

  <form id="pair" hidden>
    <label for="server">آدرس گریفین</label>
    <input id="server" class="ltr" placeholder="https://griffin.example.com" required>
    <label for="code">کد اتصال (تنظیمات ← مرورگر من)</label>
    <input id="code" class="ltr" placeholder="ABCD-1234" required autocomplete="off">
    <label for="label">نام این مرورگر</label>
    <input id="label" placeholder="Chrome · macOS">
    <button class="primary" type="submit" id="pairBtn">اتصال</button>
  </form>

  <div id="paired" hidden>
    <div class="row">
      <button type="button" id="toggle">توقف</button>
      <button type="button" id="unpair">قطع جفت</button>
    </div>
    <div class="muted" id="where"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
