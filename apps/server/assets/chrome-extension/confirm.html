<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>Griffin</title>
<style>
  body { margin: 0; padding: 20px; font: 14px/1.8 Vazirmatn, Tahoma, "Segoe UI", system-ui, sans-serif; color: #1c1917; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  .origin { direction: ltr; text-align: left; font-family: ui-monospace, Menlo, monospace; background: #f5f5f4; border-radius: 8px; padding: 6px 10px; word-break: break-all; }
  p { color: #57534e; font-size: 13px; }
  .row { display: flex; gap: 8px; margin-top: 14px; }
  button { flex: 1; font: inherit; border: 0; border-radius: 8px; padding: 8px; cursor: pointer; background: #f5f5f4; }
  #yes { background: #f97316; color: #fff; }
</style>
</head>
<body>
  <h1>این مرورگر به این گریفین وصل شود؟</h1>
  <div class="origin" id="origin"></div>
  <p>بعد از اتصال، گریفینِ این آدرس می‌تواند در تب‌های این مرورگر با لاگین‌های شما کار کند. اگر این آدرس گریفین خودتان نیست، «نه» را بزنید.</p>
  <div class="row"><button id="yes" type="button">وصل کن</button><button id="no" type="button">نه</button></div>
  <script src="confirm.js"></script>
</body>
</html>
