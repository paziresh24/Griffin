# Griffin.
#
#   docker compose -f deploy/compose.yaml up -d --build          # the app alone: chat + agents
#   COMPOSE_PROFILES=tools docker compose … up -d --build        # + the broker (infrastructure tools)
#                                                                 #   and its sandbox shell (debug_exec)
#   COMPOSE_PROFILES=tools,infra docker compose … up -d --build  # + its own vault and egress proxy
#
# The app alone is a complete install: chats, agents, jobs, charts, files, messengers. It holds the
# model API key and nothing else. The broker is what holds infrastructure credentials and turns them
# into typed tools, so it only makes sense once you have a config/site.json to point it at.

name: griffin

x-build: &build
  context: ..
  network: host  # apt/apk and npm (unless .build/npm-cache is shipped) use it

x-user: &user "${GRIFFIN_UID:-1000}:${GRIFFIN_GID:-1000}"

services:
  broker:
    profiles: [tools]
    build: { <<: *build, target: broker }
    image: griffin-broker:local
    network_mode: host
    restart: unless-stopped
    user: *user
    depends_on: [sandbox]
    environment:
      GRIFFIN_BAO_URL: http://127.0.0.1:18200
      GRIFFIN_BAO_TOKEN_AGE: /vault/machine.token.age
      GRIFFIN_AGE_IDENTITY: /keys/identity.age
      GRIFFIN_SITE_CONFIG: /config/site.json
      GRIFFIN_SSH_KNOWN_HOSTS: /config/ssh_known_hosts
      # debug_exec's default host (the sandbox service below) logs in with its own key, not yours.
      GRIFFIN_SANDBOX_KEY: /sandbox-keys/client
      GRIFFIN_SANDBOX_ADDR: 127.0.0.1:${GRIFFIN_SANDBOX_PORT:-2222}
      # git clone/fetch/push for per-chat worktrees (same path in the app and the sandbox).
      GRIFFIN_REPOS_ROOT: /workspace/repos
    volumes:
      - sockets:/run/griffin
      - ${GRIFFIN_CONFIG:-./config}:/config:ro
      - ${GRIFFIN_WORKSPACE:-./workspace}/repos:/workspace/repos
      - ${GRIFFIN_SANDBOX_DIR:-./sandbox}/keys:/sandbox-keys:ro
      # Tool credentials set from Settings → Secrets land here (encrypted) when there is no OpenBao.
      - broker-data:/broker-data
      # OpenBao is optional (profile "infra"): point these at its machine token and age identity;
      # left at /dev/null the broker uses only its own box above.
      - ${GRIFFIN_VAULT_TOKEN_AGE:-/dev/null}:/vault/machine.token.age:ro
      - ${GRIFFIN_AGE_IDENTITY:-/dev/null}:/keys/identity.age:ro

  # debug_exec's default host: a throwaway shell with no credentials. Bridge network on purpose: it
  # reaches the LAN and the internet through the host's NAT but not the host's loopback (vault,
  # proxy, broker socket stay out of reach).
  sandbox:
    profiles: [tools]
    build: { context: sandbox, network: host }
    image: griffin-sandbox:local
    restart: unless-stopped
    hostname: griffin-sandbox
    ports: ["127.0.0.1:${GRIFFIN_SANDBOX_PORT:-2222}:2222"]
    environment:
      BROKER_UID: ${GRIFFIN_UID:-1000}
    volumes:
      - ${GRIFFIN_SANDBOX_DIR:-./sandbox}/keys:/keys
      - ${GRIFFIN_SANDBOX_DIR:-./sandbox}/root:/root
      # Builds and tests run in a chat's worktree at the same path as in the app. The clones are
      # read-only here; only worktrees are writable.
      - ${GRIFFIN_WORKSPACE:-./workspace}/repos:/workspace/repos:ro
      - ${GRIFFIN_WORKSPACE:-./workspace}/repos/_wt:/workspace/repos/_wt
    mem_limit: 2g
    pids_limit: 512

  app:
    build: { <<: *build, target: app }
    image: griffin-app:local
    network_mode: host
    restart: unless-stopped
    user: *user
    environment:
      PORT: ${GRIFFIN_PORT:-3100}
      # Unset it and the app runs without infrastructure tools (see the broker profile above).
      GRIFFIN_BROKER: ${GRIFFIN_BROKER:-on}
      GRIFFIN_VERSION: ${GRIFFIN_VERSION:-local}
      CURSOR_MODEL: ${CURSOR_MODEL:-auto}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-sonnet}
      # Any OpenAI-compatible chat/completions endpoint (OpenAI, Z.ai, OpenRouter, a local server);
      # the key lives in <data>/openai.api-key.
      GRIFFIN_OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      GRIFFIN_OPENAI_MODEL: ${OPENAI_MODEL:-}
      GRIFFIN_OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-}
      # How agents refer to you in prompts and framed messages (a first name reads best).
      GRIFFIN_OWNER_NAME: ${OWNER_NAME:-}
      # The assistant's name on this install; empty = Griffin.
      GRIFFIN_ASSISTANT_NAME: ${ASSISTANT_NAME:-}
      GRIFFIN_ASSISTANT_LATIN: ${ASSISTANT_LATIN:-}
      # Optional model routing for colleague threads (e.g. claude / opus); empty = the agent profile.
      GRIFFIN_TEAM_PROVIDER: ${TEAM_PROVIDER:-}
      GRIFFIN_TEAM_MODEL: ${TEAM_MODEL:-}
      GRIFFIN_TEAM_EFFORT: ${TEAM_EFFORT:-}
      GRIFFIN_TEAM_SUB_PROVIDER: ${TEAM_SUB_PROVIDER:-}
      GRIFFIN_TEAM_SUB_MODEL: ${TEAM_SUB_MODEL:-}
      GRIFFIN_TEAM_SUB_EFFORT: ${TEAM_SUB_EFFORT:-}
      # New web chats start on this repo under <workspace>/repos; empty = no repo.
      GRIFFIN_DEFAULT_REPO: ${DEFAULT_REPO:-}
      GRIFFIN_PEER_SELF_SERVE: ${PEER_SELF_SERVE:-}
      # Links in messenger replies (charts, files) point here.
      GRIFFIN_PUBLIC_URL: ${GRIFFIN_PUBLIC_URL:-http://127.0.0.1:3100}
      # Old public host names: browser GETs get a 301 to PUBLIC_URL; POSTs (MCP, webhooks) still served.
      GRIFFIN_OLD_HOSTS: ${OLD_HOSTS:-}
      # Owner chats idle this many days go to the archive (0 = never).
      GRIFFIN_CHAT_IDLE_DAYS: ${CHAT_IDLE_DAYS:-}
      # Incident ops room: shadow (LLM triage) | record (group + show, no LLM) | off
      GRIFFIN_OPS_MODE: ${OPS_MODE:-record}
      # Telegram account (MTProto over TCP) needs SOCKS, not an HTTP proxy.
      GRIFFIN_TELEGRAM_SOCKS: ${GRIFFIN_TELEGRAM_SOCKS:-}
      # Node's built-in fetch honours these.
      NODE_USE_ENV_PROXY: "1"
      # The Cursor SDK agent stream ignores HTTPS_PROXY; apps/server/src/egress.mjs tunnels it here.
      CURSOR_PROXY: ${GRIFFIN_PROXY:-}
      HTTPS_PROXY: ${GRIFFIN_PROXY:-}
      HTTP_PROXY: ${GRIFFIN_PROXY:-}
      NO_PROXY: 127.0.0.1,localhost,::1,192.168.0.0/16,10.0.0.0/8
    volumes:
      - sockets:/run/griffin
      - ${GRIFFIN_DATA:-./data}:/data
      - ${GRIFFIN_WORKSPACE:-./workspace}:/workspace
    # No vault token, no age identity, no SSH key in this container.

  # --- profile "infra": Griffin's own egress proxy and secret store -----------------------

  xray:
    profiles: [infra]
    image: node:24-alpine  # any small image; the static xray binary is mounted
    network_mode: host
    restart: unless-stopped
    command: ["/xray/xray", "run", "-c", "/xray/config.json"]
    volumes:
      - ${GRIFFIN_XRAY_DIR:-/srv/griffin/xray}:/xray:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "${GRIFFIN_PROXY_PORT:-18118}"]
      interval: 30s
      timeout: 5s

  openbao:
    profiles: [infra]
    image: openbao/openbao@sha256:11fd73a2102cda9c55d5d881a8c3210303146a7ec1e8ac76f526e175c6d24641
    network_mode: host
    restart: unless-stopped
    command: ["server", "-config=/openbao/config.hcl"]
    environment:
      BAO_ADDR: http://127.0.0.1:18200
    volumes:
      - ${GRIFFIN_VAULT_DIR:-/srv/griffin/vault}/state/config.hcl:/openbao/config.hcl:ro
      - ${GRIFFIN_VAULT_DIR:-/srv/griffin/vault}/raft:/openbao/file
      - ${GRIFFIN_VAULT_DIR:-/srv/griffin/vault}/audit:/openbao/audit

  vault-unsealer:
    profiles: [infra]
    image: griffin-broker:local
    network_mode: host
    restart: unless-stopped
    user: *user
    command: ["node", "apps/broker/src/unseal.mjs"]
    depends_on: [openbao]
    environment:
      GRIFFIN_BAO_URL: http://127.0.0.1:18200
      GRIFFIN_UNSEAL_AGE: /vault/unseal.b64.age
      GRIFFIN_AGE_IDENTITY: /keys/identity.age
    volumes:
      - ${GRIFFIN_VAULT_DIR:-/srv/griffin/vault}/state/unseal.b64.age:/vault/unseal.b64.age:ro
      - ${GRIFFIN_AGE_IDENTITY:-/dev/null}:/keys/identity.age:ro
    healthcheck:
      disable: true

volumes:
  sockets:
  broker-data:
